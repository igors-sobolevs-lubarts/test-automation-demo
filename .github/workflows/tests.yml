name: Run Automated Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:

      # ---------------------------
      # 1. Checkout project
      # ---------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------
      # 2. Build Docker image
      # ---------------------------
      - name: Build test automation image
        run: docker build -t test-automation-demo -f docker/Dockerfile .

      # ---------------------------
      # 3. Run tests inside Docker
      # ---------------------------
      - name: Run tests with Docker (UI + API tests)
        run: |
          docker run \
            --name test-container \
            test-automation-demo

      # ---------------------------
      # 4. Copy Allure HTML report from container
      # ---------------------------
      - name: Copy Allure results from Docker container
        run: |
          mkdir -p allure-report
          docker cp test-container:/app/allure-report ./allure-report
          docker rm test-container

      # ---------------------------
      # 5. Upload generated Allure HTML report
      # ---------------------------
      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      # ---------------------------
      # 6. Deploy Allure report to GitHub Pages
      # ---------------------------
      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          publish_branch: gh-pages
